databases:
  - name: agentguard-db
    databaseName: agentguard
    user: agentguard
    plan: free

services:
  # ─── Redis Cache ────────────────────────────────────────────────
  - type: redis
    name: agentguard-redis
    plan: free
    ipAllowList: []

  # ─── Backend Web Service ─────────────────────────────────────────
  - type: web
    name: agentguard-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agentguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agentguard-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: agentguard-frontend
          property: url
      - key: PORT
        value: 3001

  # ─── Frontend Static Site ────────────────────────────────────────
  - type: web
    name: agentguard-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: agentguard-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
